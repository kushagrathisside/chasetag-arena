site_name: chasetag-arena
site_description: A one-on-one chase-tag game that runs in your browser, on your own computer
docs_dir: docs
strict: true
validation:
  anchors: warn          # broken #section links fail the strict build
  unrecognized_links: warn

nav:
  - Home: index.md
  - Install: install.md
  - First round: getting-started.md
  - The game: the-game.md
  - Playing: playing.md
  - Planners: planners.md
  - Research logging: research-logging.md
  - Troubleshooting: troubleshooting.md
  - How it works: how-it-works.md
  - API: api.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md
  - License: license.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
