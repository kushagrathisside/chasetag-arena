name: Issue status labels

# Keeps `status: ready` and `status: blocked` on the contribution issues correct: an issue is
# blocked until the issues it needs (docs/assets/contribution-plan.json) are closed.
on:
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-status
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Update the labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync_issue_status.mjs
